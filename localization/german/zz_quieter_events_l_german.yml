  # Prisoner Release Acceptance
  quieter.prisonrelease.title:0 "Gefangener freigelassen"
  quieter.prisonrelease.message:0 "[recipient.GetShortUINameNoTooltip] hat Euren Kerker verlassen."

  # Marriage Proposal Accepted
  quieter.marriage.title:0 "Heiratsantrag angenommen"
  quieter.marriage.desc:0 "[secondary_recipient.GetFirstName] wird [secondary_actor.GetFirstName] heiraten."

  # Seduction Scheme Discovery
  quieter.seduce_outcome.3901.t:0 "Ein Lustmolch am Hofe"
  quieter.seduce_outcome.desc:0 "[owner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] hat eine Affäre mit [target.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]. Welch [owner.Custom('InsultAdjective')] [owner.Custom('InsultNounSexual')]!"

  # Child of My Dynasty Birth
  quieter.birth.dynastic.title:0 "Kind meiner Dynastie"
  quieter.birth.dynastic.message:0 "[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] hat ein Kind zur Welt gebracht! Das Kleine soll [child.GetFirstNameNoTooltip] heißen."
  quieter.birth.dynastic.message.twin:0 "[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] hat zwei [child.Custom('TwinDaughtersSonsChildren')] zur Welt gebracht!"

  # Message Filter
  message_filter_quieter_events:0 "@catch_all_icon! Quieter Events Mod"
  message_filter_quieter_events_desc:0 "Filtert Nachrichten des Quieter-Events-Mods. Funktioniert nur, wenn die Quieter-Spielregeln gesetzt sind."
  message_filter_quieter_events_tutor_education:0 "@jester_icon! QE: Lehrer unterrichtet Kind"
  message_filter_quieter_events_tutor_education_desc:0 "Ein Tutor oder Guru, der die Kinder Eures Hofes unterrichtet, verbessert die Fertigkeiten eines Kindes. Vom Quieter-Events-Mod hinzugefügt, damit diese Nachrichten ausgeblendet werden können."

